services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripfinder}
      POSTGRES_DB: ${POSTGRES_DB:-tripfinder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripfinder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tripfinder}:${POSTGRES_PASSWORD:-tripfinder}@postgres:5432/${POSTGRES_DB:-tripfinder}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build: ./backend
    command: ["python", "-m", "tripfinder.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tripfinder}:${POSTGRES_PASSWORD:-tripfinder}@postgres:5432/${POSTGRES_DB:-tripfinder}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres-data:
